services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - clinic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ClinicAssistant/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5056
      LOG_FILE_PATH: /app/Logs/logs.txt
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ClinicAssistant
      JwtSettings__Audience: ClinicAssistantClient
      JwtSettings__ExpiryMinutes: 60
      AdminSettings__Email: ${ADMIN_EMAIL}
      AdminSettings__Password: ${ADMIN_PASSWORD}
      AdminSettings__FirstName: ${ADMIN_FIRST_NAME:-Admin}
      AdminSettings__LastName: ${ADMIN_LAST_NAME:-User}
      LlmSettings__ApiKey: ${ANTHROPIC_API_KEY}
      LlmSettings__ModelId: ${LLM_MODEL_ID:-claude-sonnet-4-6}
      LlmSettings__UseStub: "false"
      LlmSettings__LogPrompts: "false"
      LlmSettings__LogResponses: "false"
      WhisperSettings__UseCuda: "true"
      WhisperSettings__UseStub: "false"
      WhisperSettings__ModelFileName: ggml-medium.bin
      WhisperSettings__Language: ro
      WhisperSettings__LogTimings: "true"
      AllowedOrigins__0: http://localhost:8080
    volumes:
      - whisper-models:/app/App_Data/models
      - uploads:/app/App_Data/uploads
      - ./backend/logs:/app/Logs
    networks:
      - clinic-net
    # Remove the deploy section below if you don't have an NVIDIA GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/clinic-assistant-web
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - clinic-net
    restart: unless-stopped

volumes:
  postgres-data:
  whisper-models:
  uploads:

networks:
  clinic-net:
    driver: bridge
